<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products · HECOTH B2B Electric, Fuel & Dirt Bikes</title>
  <meta name="description" content="Complete product lineup: electric motorcycles, fuel motorcycles, 200cc dirt bikes, OEM parts. B2B wholesale supplier." />
  <meta name="keywords" content="electric motorcycle, fuel motorcycle, dirt bike, 200cc dirt bike, motorcycle parts, B2B products, wholesale" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://hecothmotorcycle.vercel.app/products.html" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    /* 分类按钮样式 */
    .filter-btn {
      background: #1A1D22;
      color: #C2C2C2;
      border: 1px solid #2D3038;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .filter-btn:hover {
      border-color: #FF9922;
      color: #FF9922;
      transform: translateY(-2px);
    }
    .filter-btn.active {
      background: #FF9922;
      color: #111;
      border-color: #FF9922;
      box-shadow: 0 0 20px rgba(255, 153, 34, 0.3);
    }
    .filter-btn i { font-size: 0.9em; }

    /* 产品卡片淡入动画 */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .product-card.fade-in {
      animation: fadeInUp 0.4s ease both;
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #8A8A8A;
    }
    .empty-state i {
      font-size: 3rem;
      color: #FF9922;
      opacity: 0.4;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<nav id="site-nav" class="floating-nav"></nav>

<main class="page-wrap">
  <h2 class="text-4xl font-bold mb-4">
    <span class="text-gold" data-i18n="products.title">Products</span>
  </h2>
  <p class="text-gray-400 mb-8" data-i18n="products.sub">
    Complete lineup of electric, fuel motorcycles and precision parts.
  </p>

  <!-- ===== 分类筛选按钮 ===== -->
  <div class="flex flex-wrap gap-3 mb-10" id="filter-bar">
    <button class="filter-btn active" data-filter="all">
      <i class="fas fa-th"></i> <span>All Products</span>
    </button>
    <button class="filter-btn" data-filter="electric">
      <i class="fas fa-charging-station"></i> <span>E-Moto</span>
    </button>
    <button class="filter-btn" data-filter="fuel">
      <i class="fas fa-gas-pump"></i> <span>Fuel Moto</span>
    </button>
    <button class="filter-btn" data-filter="parts">
      <i class="fas fa-cogs"></i> <span>Parts</span>
    </button>
  </div>

  <!-- ===== 产品网格 ===== -->
  <div class="grid md:grid-cols-3 gap-8" id="product-grid"></div>

  <!-- ===== 空状态（筛选无结果时显示）===== -->
  <div id="empty-state" class="empty-state" style="display:none">
    <i class="fas fa-search"></i>
    <p>No products found in this category.</p>
  </div>
</main>

<footer id="site-footer" class="border-t border-white/5 py-8 px-4 text-center text-xs text-gray-500 bg-[#080a0c] mt-8"></footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/main.js"></script>
<script>
  // ============================================================
  // 产品列表渲染 + 分类筛选
  // ============================================================
  (function () {
    let currentFilter = 'all';

    // ---------- 产品分类映射 ----------
    // 关键：把 yfy200 和 yfy200-11 都归到 'fuel' 分类
    const CATEGORY_MAP = {
      e4: 'electric',
      f450: 'fuel',
      parts: 'parts',
      yfy200: 'fuel',        // ← Dirt Bike 归到 Fuel Moto
      'yfy200-11': 'fuel'    // ← Dirt Bike 归到 Fuel Moto
    };

    // ---------- 每个产品的列表简版参数 ----------
    const listSpecs = {
      e4: [
        ['Motor', '12kW PMSM'],
        ['Battery', '72V 60Ah LiFePO₄'],
        ['Range', '140 km'],
        ['Top speed', '110 km/h']
      ],
      f450: [
        ['Engine', '450cc EFI'],
        ['Power', '38 HP'],
        ['Weight', '165 kg'],
        ['Seat', '890 mm']
      ],
      parts: [
        ['Brake pads', 'Sintered'],
        ['Chain kit', '520 O-ring'],
        ['LED lights', 'DRL'],
        ['Stock', '200+ SKU']
      ],
      yfy200: [
        ['Engine', '200cc 4-stroke'],
        ['Power', '10KW / 7500rpm'],
        ['Gear', '5-speed manual'],
        ['Fuel tank', '14 L']
      ],
      'yfy200-11': [
        ['Engine', '200cc 4-stroke'],
        ['Power', '10KW / 7500rpm'],
        ['Gear', '5-speed manual'],
        ['Model', '2013 classic']
      ]
    };

    // ---------- 卡片标题短名 ----------
    const shortNames = {
      e4: 'E4',
      f450: 'F450',
      parts: 'Parts Pro',
      yfy200: 'YFY200GY-12',
      'yfy200-11': 'YFY200GY-11'
    };

    // ---------- 分类标签（显示在卡片右上角） ----------
    const categoryLabels = {
      electric: { text: 'E-Moto', color: '#FF9922' },
      fuel: { text: 'Fuel Moto', color: '#FF9922' },
      parts: { text: 'Parts', color: '#FF9922' }
    };

    // ---------- 获取产品的实际分类 ----------
    function getProductCategory(product) {
      // 优先用映射表；如果不在，用产品自带的 category
      if (CATEGORY_MAP[product.id]) return CATEGORY_MAP[product.id];
      // fallback：把 'dirt bike' 视作 fuel
      if (product.category === 'dirt bike') return 'fuel';
      return product.category || 'other';
    }

    // ---------- 渲染产品 ----------
    function renderProducts(filter) {
      const grid = document.getElementById('product-grid');
      const emptyState = document.getElementById('empty-state');
      if (!grid) return;

      const dict = window.TRANSLATIONS[window.HECOTH.getLang()];
      let html = '';
      let count = 0;

      Object.values(window.PRODUCTS).forEach(p => {
        const cat = getProductCategory(p);

        // 筛选
        if (filter !== 'all' && cat !== filter) return;

        count++;

        const specs = listSpecs[p.id] || [];
        const specsHtml = specs.map(([k, v]) =>
          `<p><span class="spec-label">${k}:</span> <span class="spec-value">${v}</span></p>`
        ).join('');

        const shortName = shortNames[p.id] || p.name;
        const catLabel = categoryLabels[cat] || { text: cat, color: '#FF9922' };

        html += `
          <div class="product-card fade-in">
            <div class="relative">
              <img src="${p.image}"
                   alt="${p.name} - B2B wholesale supplier"
                   class="rounded-lg w-full border border-white/10 h-48 object-cover"
                   loading="lazy"
                   onerror="this.onerror=null; this.src='assets/images/placeholder.svg';" />
              <span class="absolute top-2 right-2 text-xs font-bold px-3 py-1 rounded-full"
                    style="background:${catLabel.color};color:#111;">
                ${catLabel.text}
              </span>
            </div>

            <div class="flex items-center gap-3 text-gold text-xl mt-4">
              <i class="fas ${p.icon}"></i>
              <span class="text-base font-bold">${shortName}</span>
            </div>

            <div class="mt-3 space-y-1 text-sm">${specsHtml}</div>

            <div class="flex gap-3 mt-4 flex-wrap">
              <a href="contact.html?product=${p.id}" class="btn-primary text-sm px-5 py-2">
                <i class="fas fa-envelope mr-2"></i> <span data-i18n="common.quote">Quote</span>
              </a>
              <a href="product-detail.html?id=${p.id}" class="btn-secondary text-sm px-5 py-2">
                <i class="fas fa-info-circle mr-2"></i> <span data-i18n="common.details">Details</span>
              </a>
            </div>
          </div>
        `;
      });

      grid.innerHTML = html;
      emptyState.style.display = (count === 0) ? 'block' : 'none';

      // 重新应用多语言
      if (dict) {
        grid.querySelectorAll('[data-i18n]').forEach(el => {
          const k = el.dataset.i18n;
          if (dict[k] !== undefined) el.textContent = dict[k];
        });
      }
    }

    // ---------- 绑定筛选按钮 ----------
    function bindFilters() {
      const bar = document.getElementById('filter-bar');
      if (!bar) return;

      bar.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function () {
          // 切换 active 状态
          bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');

          // 重新渲染
          currentFilter = this.dataset.filter;
          renderProducts(currentFilter);
        });
      });
    }

    // ---------- 初始化 ----------
    document.addEventListener('DOMContentLoaded', function () {
      bindFilters();
      renderProducts('all');
    });

    // 语言切换时重新渲染
    document.addEventListener('langchange', function () {
      renderProducts(currentFilter);
    });
  })();
</script>
</body>
</html>
