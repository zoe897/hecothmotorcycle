<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details · HECOTH B2B</title>
  <meta name="description" content="Detailed technical specifications for HECOTH electric motorcycles, electric street bikes, fuel motorcycles and dirt bikes." />
  <meta name="keywords" content="dirt bike, electric motorcycle, electric street motorcycle, fuel motorcycle, motorcycle parts, B2B wholesale" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://hecothmotorcycle.vercel.app/product-detail.html" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<nav id="site-nav" class="floating-nav"></nav>

<main class="page-wrap">
  <div class="mb-6">
    <a href="products.html" class="btn-back">
      <i class="fas fa-arrow-left mr-2"></i> <span data-i18n="common.back">Back to Products</span>
    </a>
  </div>
  <div id="product-detail-container"></div>
</main>

<footer id="site-footer" class="border-t border-white/5 py-8 px-4 text-center text-xs text-gray-500 bg-[#080a0c] mt-8"></footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/main.js"></script>
<script>
  (function () {
    function getQueryId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id') || 'e4';
    }

    // 从多语言字段里取值（兼容旧版字符串字段）
    function pick(field, lang) {
      if (field === null || field === undefined) return '';
      if (typeof field === 'string') return field; // 兼容旧的纯字符串
      return field[lang] || field.en || '';
    }

    function render() {
      const id = getQueryId();
      const p = window.PRODUCTS[id];
      const container = document.getElementById('product-detail-container');
      const lang = window.HECOTH.getLang();
      const dict = window.TRANSLATIONS[lang];

      if (!p) {
        container.innerHTML = '<p class="text-center text-gray-400">Product not found. <a href="products.html" class="text-gold">Back to Products</a></p>';
        return;
      }

      // 取出当前语言的字段
      const productName = pick(p.name, lang);
      const productDesc = pick(p.description, lang);
      const productHighlights = Array.isArray(p.highlights)
        ? p.highlights
        : (p.highlights && p.highlights[lang]) || (p.highlights && p.highlights.en) || [];

      // SEO 标题
      let titleSuffix = ' · B2B Wholesale Supplier · HECOTH';
      if (p.id === 'e4' || p.id === 'street-ev') {
        titleSuffix = ' Electric · B2B Wholesale Supplier · HECOTH';
      } else if (p.id.startsWith('yfy200')) {
        titleSuffix = ' 200cc · B2B Wholesale Supplier · HECOTH';
      }
      document.title = productName + titleSuffix;

      const setMeta = (sel, attr, val) => {
        const el = document.querySelector(sel);
        if (el) el.setAttribute(attr, val);
      };
      setMeta('meta[name="description"]', 'content', productDesc.substring(0, 155));
      setMeta('meta[name="keywords"]', 'content', p.keywords);
      setMeta('link[rel="canonical"]', 'href',
        'https://hecothmotorcycle.vercel.app/product-detail.html?id=' + p.id);

      // 规格表（英文）
      const specsRows = Object.entries(p.specs).map(([k, v]) =>
        `<tr><td class="label">${k}</td><td>${v}</td></tr>`
      ).join('');

      // 亮点（当前语言）
      const highlightsHtml = productHighlights.map(h =>
        `<li class="flex items-start gap-2"><i class="fas fa-check-circle text-gold mt-0.5"></i> <span>${h}</span></li>`
      ).join('');

      const mainImg = `
        <img src="${p.image}"
             alt="${productName} - B2B wholesale supplier China"
             class="w-full rounded-xl"
             onerror="this.onerror=null; this.src='assets/images/placeholder.svg';" />
      `;

      const galleryHtml = p.gallery.map((img, i) =>
        `<img src="${img}"
              alt="${productName} - view ${i + 1} - B2B manufacturer"
              class="w-28 h-20 object-cover cursor-pointer"
              loading="lazy"
              onerror="this.onerror=null; this.src='assets/images/placeholder.svg';" />`
      ).join('');

      // JSON-LD
      const existingJsonLd = document.getElementById('dynamic-product-jsonld');
      if (existingJsonLd) existingJsonLd.remove();

      const jsonLd = document.createElement('script');
      jsonLd.id = 'dynamic-product-jsonld';
      jsonLd.type = 'application/ld+json';

      const baseSchema = {
        "@context": "https://schema.org/",
        "@type": "Product",
        "name": productName,
        "image": [
          "https://hecothmotorcycle.vercel.app/" + p.image,
          ...p.gallery.map(g => "https://hecothmotorcycle.vercel.app/" + g)
        ],
        "description": productDesc,
        "sku": p.id,
        "brand": { "@type": "Brand", "name": "HECOTH" },
        "category": p.category,
        "offers": {
          "@type": "AggregateOffer",
          "priceCurrency": "USD",
          "lowPrice": "600",
          "highPrice": "900",
          "offerCount": "30",
          "availability": "https://schema.org/InStock",
          "seller": { "@type": "Organization", "name": "HECOTH" }
        }
      };

      if (p.id === 'street-ev') {
        baseSchema.subjectOf = [
          {
            "@type": "Question",
            "name": "What is the top speed of this electric street motorcycle?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The HECOTH Electric Street Motorcycle has a top speed of 90 km/h."
            }
          },
          {
            "@type": "Question",
            "name": "How far can this electric motorcycle travel on one charge?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It offers a range of 100–120 km per full charge with a 72V lithium battery."
            }
          },
          {
            "@type": "Question",
            "name": "What is the MOQ for wholesale orders?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The MOQ is 30 units, and 75 pcs fit in a 40HQ container."
            }
          }
        ];
      }

      jsonLd.textContent = JSON.stringify(baseSchema);
      document.head.appendChild(jsonLd);

      container.innerHTML = `
        <div class="grid md:grid-cols-2 gap-10">
          <div>
            <div class="bg-card p-4 rounded-2xl border border-white/10">
              ${mainImg}
            </div>
            <div class="detail-gallery mt-4">${galleryHtml}</div>
          </div>
          <div>
            <div class="flex items-center gap-3 text-gold text-2xl mb-2">
              <i class="fas ${p.icon}"></i>
              <span class="text-sm text-gray-400 uppercase tracking-wider">${p.category}</span>
            </div>
            <h1 class="text-4xl font-black">${productName}</h1>
            <p class="text-gray-300 mt-4 leading-relaxed">${productDesc}</p>
            <ul class="mt-6 space-y-2 text-sm">${highlightsHtml}</ul>
            <div class="flex gap-3 mt-8 flex-wrap">
              <a href="contact.html?product=${p.id}" class="btn-primary">
                <i class="fas fa-envelope mr-2"></i> <span data-i18n="common.quote">Quote</span>
              </a>
              <a href="products.html" class="btn-secondary">
                <i class="fas fa-arrow-left mr-2"></i> <span data-i18n="common.back">Back to Products</span>
              </a>
            </div>
          </div>
        </div>

        <div class="mt-12 bg-card p-8 rounded-2xl border border-white/10">
          <h2 class="text-2xl font-bold mb-6">
            <span class="text-gold" data-i18n="product.specs">Specification</span>
          </h2>
          <table class="spec-table">${specsRows}</table>
        </div>

        <div class="mt-8 bg-card p-8 rounded-2xl border border-white/10">
          <h2 class="text-2xl font-bold mb-4">
            <span class="text-gold">Terms &amp; Conditions</span>
          </h2>
          <ul class="text-sm text-gray-300 space-y-3">
            <li><span class="text-gold font-semibold">Packing term:</span> Standard exporting packaging</li>
            <li><span class="text-gold font-semibold">Shipping:</span> By sea</li>
            <li><span class="text-gold font-semibold">Delivery Time:</span> Within 30–45 days on receipt of prepayment (based on final quantity and manufacturer production schedule). Production may be longer during national holidays such as Chinese Spring Festival.</li>
            <li><span class="text-gold font-semibold">Remark:</span> Product specifications and parameters are subject to change for improving reliability, function or design.</li>
          </ul>
        </div>

        <div class="mt-6 text-xs text-gray-500">
          <i class="fas fa-tag mr-1"></i> ${p.keywords}
        </div>
      `;

      if (dict) {
        container.querySelectorAll('[data-i18n]').forEach(el => {
          const k = el.dataset.i18n;
          if (dict[k] !== undefined) el.textContent = dict[k];
        });
      }
    }

    document.addEventListener('DOMContentLoaded', render);
    document.addEventListener('langchange', render);
  })();
</script>
</body>
</html>
